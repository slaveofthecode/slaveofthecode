name: Sync RAG snapshot

on:
  pull_request:
    branches:
      - main
    paths:
      - packages/content/data/cv.json
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - main
    paths:
      - packages/content/data/cv.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-rag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  sync-rag:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$HEAD_REPO" != "$REPO" ]; then
              echo "mode=fork" >> "$GITHUB_OUTPUT"
              echo "Fork PRs cannot receive generated commits with this token." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "mode=pr" >> "$GITHUB_OUTPUT"
            echo "branch=$HEAD_REF" >> "$GITHUB_OUTPUT"
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "mode=branch" >> "$GITHUB_OUTPUT"
            echo "branch=chore/rag-sync" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.target.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check snapshot freshness
        id: freshness
        continue-on-error: true
        run: bun run check:rag-freshness

      - name: Skip when snapshot is fresh
        if: steps.freshness.outcome == 'success'
        run: echo "RAG snapshot already matches cv.json."

      - name: Regenerate snapshot
        if: steps.freshness.outcome == 'failure' && steps.target.outputs.mode != 'fork'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_EMBED_MODEL: ${{ vars.GEMINI_EMBED_MODEL || 'gemini-embedding-001' }}
        run: bun run --filter @portfolio/api build:rag

      - name: Verify regenerated snapshot
        if: steps.freshness.outcome == 'failure' && steps.target.outputs.mode != 'fork'
        run: |
          bun run check:rag-freshness
          bun run lint
          bun run typecheck
          bun test
          bun run build
          bun run check:boundaries

      - name: Record sync in STATUS
        if: steps.freshness.outcome == 'failure' && steps.target.outputs.mode != 'fork'
        env:
          RAG_SYNC_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RAG_SYNC_RUN_ID: ${{ github.run_id }}
        run: bun scripts/record-rag-sync.ts

      - name: Refresh same-repo PR
        if: steps.freshness.outcome == 'failure' && steps.target.outputs.mode == 'pr'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git fetch origin "$TARGET_BRANCH"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]; then
            echo "PR branch moved during the run; leaving the refresh to the newer run."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/api/data/cv.sqlite apps/api/src/data/rag-db.ts docs/STATUS.md
          git commit -m "chore(rag): refresh snapshot for cv.json change"
          git push origin "HEAD:$TARGET_BRANCH"

          BODY="RAG snapshot refreshed from \`${SOURCE_SHA}\` (workflow run ${RUN_ID}). The generated artifacts were pushed to this PR; CI will re-run on the new head."
          gh pr comment "$PR_NUMBER" --body "$BODY" || true

      - name: Open sync PR
        if: steps.freshness.outcome == 'failure' && steps.target.outputs.mode == 'branch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/rag-sync"
          git switch -C "$BRANCH"
          git add apps/api/data/cv.sqlite apps/api/src/data/rag-db.ts docs/STATUS.md
          git commit -m "chore(rag): sync snapshot with cv.json"
          git push --force-with-lease origin "$BRANCH"

          TITLE="chore(rag): sync snapshot with cv.json"
          BODY="Automated RAG snapshot refresh for \`${SOURCE_SHA}\` (workflow run ${RUN_ID}). Both generated artifacts were rebuilt from \`packages/content/data/cv.json\`."
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" --assignee @me
          fi
